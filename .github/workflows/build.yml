name: APK fordítás

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Kulcstár visszaállítása
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Hiányzik a KEYSTORE_BASE64 titok. Állítsd be: Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/raktar.jks

      - name: Release APK fordítása
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/raktar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "HaNiZso-Raktar-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HaNiZso-Raktar-1.0.${{ github.run_number }}
          path: HaNiZso-Raktar-*.apk
          retention-days: 90

      - name: Kiadás (Release) létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HaNiZso Raktár 1.0.${{ github.run_number }}
          files: HaNiZso-Raktar-*.apk
