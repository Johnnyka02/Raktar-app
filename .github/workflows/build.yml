name: APK fordítás

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Az Android SDK a GitHub ubuntu gépein előre telepítve van (ANDROID_HOME)

      - name: Kulcstár visszaállítása
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Hiányzik a KEYSTORE_BASE64 titok. Állítsd be: Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/raktar.jks

      - name: Release APK fordítása
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/raktar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # A verziószám a helyi (kézi) kiadások fölött indul: 100 + futás sorszáma
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "VC=$VERSION_CODE" >> $GITHUB_ENV
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "HaNiZso-Raktar-1.0.$VERSION_CODE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HaNiZso-Raktar-1.0.${{ env.VC }}
          path: HaNiZso-Raktar-*.apk
          retention-days: 90

      - name: Kiadás (Release) létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.VC }}
          name: HaNiZso Raktár 1.0.${{ env.VC }}
          files: HaNiZso-Raktar-*.apk
